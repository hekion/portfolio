<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紺碧 | KONPEKI (パズルレイアウト実験)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500;700&family=Yuji+Boku&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* メインコンテナの余分な高さをなくし、コンテンツ量に応じて自然に伸びるようにする */
        .main-container {
            position: relative;
            margin-top: 40px;
            margin-bottom: 60px;
            min-height: auto;
        }

        .album-view {
            display: none;
        }
        .album-view.active {
            display: block;
        }
        .back-btn {
            background: transparent;
            border: 1px solid var(--gold-color);
            color: var(--gold-color);
            padding: 8px 16px;
            font-family: 'Noto Serif JP', serif;
            cursor: pointer;
            margin-bottom: 20px;
            letter-spacing: 0.15em;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background-color: var(--gold-color);
            color: var(--bg-color);
        }
        .album-title-area {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            padding-bottom: 10px;
        }

        /* サムネイルの比率を正確な 3:2 に固定 */
        .thumbnail-wrapper {
            width: 100%;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }

        .thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }

        .work-item:hover .thumbnail-wrapper img {
            transform: scale(1.05);
        }

        /* パズル風レイアウト */
        .album-photos-grid {
            column-count: 3;
            column-gap: 20px;
        }

        .album-photo-item {
            break-inside: avoid;
            margin-bottom: 20px;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(197, 160, 89, 0.2);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .album-photo-item:hover {
            transform: translateY(-4px);
            border-color: var(--gold-color);
        }

        .album-photo-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }

        .album-photo-item:hover img {
            transform: scale(1.03);
        }

        /* スマホ向け調整 */
        @media screen and (max-width: 768px) {
            .album-photos-grid {
                column-count: 2;
                column-gap: 12px;
            }
            .album-photo-item {
                margin-bottom: 12px;
            }
        }
    </style>
</head>
<body>

    <main class="main-container">
        
        <!-- アルバム一覧ビュー -->
        <div id="galleryMainView">
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="photo">写真（アルバム）</button>
            </div>
            <div class="gallery-grid"></div>
        </div>

        <!-- アルバムの中身ビュー（パズル形式） -->
        <div id="albumDetailView" class="album-view">
            <button class="back-btn" id="backToGallery">&larr; 一覧に戻る</button>
            <h2 class="album-title-area" id="albumDetailTitle">アルバム名</h2>
            <div class="album-photos-grid" id="albumPhotosGrid"></div>
        </div>

    </main>

    <!-- 画像拡大表示用モーダル -->
    <div class="modal" id="imageModal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modalImg" alt="拡大画像">
    </div>

    <script src="assets/js/test-album.js"></script>
</body>
</html>
