<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紺碧 | KONPEKI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500;700&family=Yuji+Boku&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- ファーストビュー：白い木枠の襖と迫力の縦書きタイトル、スクロール案内 -->
    <div class="hero-fusuma" id="fusuma">
        <div class="fusuma-panel fusuma-left">
            <div class="fusuma-handle"></div>
        </div>
        <div class="fusuma-panel fusuma-right">
            <div class="fusuma-handle"></div>
        </div>
    </div>

    <div class="hero-overlay" id="heroOverlay">
        <h1 class="vertical-title">紺碧</h1>
        <div class="scroll-indicator">
            <span class="scroll-text">SCROLL</span>
            <div class="scroll-arrow"></div>
        </div>
    </div>

    <!-- メインコンテンツ（作品一覧＆絞り込み） -->
    <main class="main-container">

        <!-- 5枚の雑多な写真で全体を埋め尽くすウェルカムスペース -->
        <section class="welcome-space">
            <div class="chaotic-gallery">
                <div class="chaotic-photo cp-1">
                    <img src="assets/images/daily/sample1.jpg" alt="日常の写真1">
                </div>
                <div class="chaotic-photo cp-2">
                    <img src="assets/images/daily/sample2.jpg" alt="日常の写真2">
                </div>
                <div class="chaotic-photo cp-3">
                    <img src="assets/images/daily/sample3.jpg" alt="日常の写真3">
                </div>
                <div class="chaotic-photo cp-4">
                    <img src="assets/images/daily/sample4.jpg" alt="日常の写真4">
                </div>
                <div class="chaotic-photo cp-5">
                    <img src="assets/images/daily/sample5.jpg" alt="日常の写真5">
                </div>
            </div>
            <div class="welcome-scroll-hint">
                <span>SCROLL</span>
                <div class="arrow-down"></div>
            </div>
        </section>

        <!-- 絞り込みボタン -->
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">すべて</button>
            <button class="filter-btn" data-filter="chirashi">チラシ・POP</button>
            <button class="filter-btn" data-filter="photo-landscape">写真：風景</button>
            <button class="filter-btn" data-filter="photo-food">写真：食べ物</button>
            <button class="filter-btn" data-filter="photo-sports">写真：スポーツ</button>
            <button class="filter-btn" data-filter="photo-people">写真：人物</button>
            <button class="filter-btn" data-filter="photo-other">写真：その他</button>
            <button class="filter-btn" data-filter="thumb">サムネイル</button>
            <button class="filter-btn" data-filter="video">動画編集</button>
            <button class="filter-btn" data-filter="web">ウェブサイト</button>
        </div>

        <!-- ギャラリー -->
        <div class="gallery-grid"></div>
    </main>

    <!-- 画像拡大表示用モーダル -->
    <div class="modal" id="imageModal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modalImg" alt="拡大画像">
    </div>

    <!-- 各カテゴリのデータファイル -->
    <script src="assets/js/chirashi.js"></script>
    <script src="assets/js/photo.js"></script>
    <script src="assets/js/thumb.js"></script>
    <script src="assets/js/video.js"></script>
    <script src="assets/js/web.js"></script>
    <!-- メインの制御スクリプト -->
    <script src="assets/js/script.js"></script>
</body>
</html>
